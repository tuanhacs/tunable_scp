defaults: [../default.yaml]
task: regression
experiment:
  name: constraint_compare_ecp_regression
  type: constraint_compare_ecp
  trials: 1000
  # Relative numerical tolerance used only when checking size <= budget.
  constraint_tolerance: 1.0e-10
datasets: [synthetic_regression, california_housing, superconductivity]
model:
  mean: gradient_boosting
  scale: gradient_boosting
method:
  delta: 0.1
  delta_by_dataset:
    synthetic_regression: 1.0
    california_housing: 0.2
    superconductivity: 5.0
budget:
  value_by_dataset:
    synthetic_regression: 15.0
    california_housing: 2.0
    superconductivity: 40.0
data:
  total_calibration_sizes: [500, 1000, 2000, 4000, 6000]
