defaults: [../default.yaml]
task: regression
experiment:
  name: compare_ecp_regression
  type: compare_ecp
  trials: 2000
  batch_size: 1000
  batches: 100
  budget_steps: 7
  budget_ranges:
    synthetic_regression: [12.0, 18.0]
    california_housing: [1.5, 3.0]
    superconductivity: [34.0, 40.0]
  match_ecp_C_ranges:
    synthetic_regression: [13.0, 13.0]
    california_housing: [2.0, 2.0]
    superconductivity: [36.0, 36.0]
  match_coverage_tolerance: 0.01
  variants:
    - { name: "TsCP", method: tscp, delta: 0.001 }
    - { name: "eCP", method: ecp }
seeds: [0]
datasets: [synthetic_regression, california_housing, superconductivity]
