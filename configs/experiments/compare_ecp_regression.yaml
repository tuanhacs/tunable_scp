defaults: [../default.yaml]
task: regression
experiment:
  name: compare_ecp_regression
  type: compare_ecp
  # Fit one model, generate a common pool of random (calibration, test-point)
  # trials, then repeatedly subsample that pool to obtain plotted points.
  trials: 2000
  batch_size: 1000
  batches: 50
  budget_steps: 31
  budget_ranges:
    synthetic_regression: [12.0, 18.0]
    california_housing: [1.5, 3.0]
    superconductivity: [32.0, 41.0]
  variants:
    - {name: "TsCP", method: tscp, delta: 0.10}
    - {name: "eCP", method: ecp}
seeds: [0]
datasets: [synthetic_regression, california_housing, superconductivity]
