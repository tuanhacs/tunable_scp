defaults: [../default.yaml]
task: regression
experiment:
  name: compare_ecp_regression
  type: compare_ecp
  trials: 6000
  batch_size: 2000
  batches: 500
  budget_steps: 1
  budget_ranges:
    synthetic_regression: [15.0, 15.0]
    california_housing: [3.0, 3.0]
    superconductivity: [40.0, 40.0]
  # Pre-chosen target coverage for the matched comparison. A paired batch is
  # retained only when both methods satisfy |coverage - target| <= tolerance.
  match_coverage_target:
    synthetic_regression: 0.954
    california_housing: 0.973
    superconductivity: 0.910
  match_coverage_tolerance:
    synthetic_regression: 0.003
    california_housing: 0.003
    superconductivity: 0.003
  variants:
    - { name: "TsCP", method: tscp, delta: 0.001 }
    - { name: "eCP", method: ecp }
seeds: [0]
seeds_by_dataset:
  synthetic_regression: [0]
  california_housing: [0]
  superconductivity: [0, 1, 2, 3, 4]
datasets: [synthetic_regression, california_housing, superconductivity]
