defaults: [../default.yaml]
task: classification
method:
  delta: 1.0
  # delta_by_dataset:
  #   synthetic_classification: 2.0
  #   mnist: 2.0
  #   covertype: 1.0
experiment:
  name: compare_ecp_classification
  type: compare_ecp
  trials: 8000
  batch_size: 4000
  batches: 1000
  budget_steps: 1
  budget_ranges:
    synthetic_classification: [16, 16]
    mnist: [4, 4]
    covertype: [4, 4]
  # Edit these pre-chosen targets using the raw coverage-size plot. A paired
  # batch is retained only when both methods fall in the same target window.
  match_coverage_target:
    synthetic_classification: 0.970
    mnist: 0.986
    covertype: 0.996
  match_coverage_tolerance:
    synthetic_classification: 0.003
    mnist: 0.003
    covertype: 0.002
  variants:
    - { name: "TsCP", method: tscp, score: one_minus_probability }
    - { name: "eCP", method: ecp, score: negative_log_probability }
seeds: [0]
seeds_by_dataset:
  synthetic_classification: [0]
  mnist: [0]
  covertype: [0]
datasets: [synthetic_classification, mnist, covertype]
