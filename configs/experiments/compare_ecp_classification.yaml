defaults: [../default.yaml]
task: classification
method:
  delta: 1.0
  delta_by_dataset:
    synthetic_classification: 2.0
    mnist: 2.0
    covertype: 1.0
experiment:
  name: compare_ecp_classification
  type: compare_ecp
  trials: 4000
  batch_size: 2000
  batches: 200
  budget_steps: 3
  budget_ranges:
    synthetic_classification: [14, 16]
    mnist: [3, 5]
    covertype: [3, 5]
  match_tscp_C_ranges:
    synthetic_classification: [15, 15]
    mnist: [4, 4]
    covertype: [4, 4]
  match_coverage_tolerance: 0.005
  variants:
    - { name: "TsCP", method: tscp, score: one_minus_probability }
    - { name: "eCP", method: ecp, score: negative_log_probability }
seeds: [0]
datasets: [synthetic_classification, mnist, covertype]
