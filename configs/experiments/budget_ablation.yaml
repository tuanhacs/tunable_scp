defaults: [../default.yaml]
experiment:
  name: budget_ablation
  type: budget_ablation
  trials_by_dataset:
    california_housing: 8000
    mnist: 8000
  batch_size_by_dataset:
    california_housing: 1000
    mnist: 1000
  batches_by_dataset:
    california_housing: 500
    mnist: 1000
  match_coverage_target:
    california_housing:
      sigma: 0.976
      log_sigma: 0.976
    mnist:
      entropy: 0.978
      margin: 0.978
  match_coverage_tolerance:
    california_housing: 0.003
    mnist: 0.003
  budget_variants_by_dataset:
    california_housing:
      - { name: sigma, title: "Sigma-based Budget", uncertainty: sigma }
      - { name: log_sigma, title: "Log-sigma Budget", uncertainty: log_sigma }
    mnist:
      - { name: entropy, title: "Entropy-based Budget", uncertainty: entropy }
      - { name: margin, title: "Margin-based Budget", uncertainty: margin }
datasets: [california_housing, mnist]
seeds_by_dataset:
  california_housing: [0]
  mnist: [0, 1, 2, 3, 4, 5, 6, 7, 8]
method:
  score: one_minus_probability
  delta_by_dataset:
    california_housing: 0.001
    mnist: 1.0
budget:
  minimum_by_dataset:
    california_housing: 2.5
    mnist: 2.0
  maximum_by_dataset:
    california_housing: 3.5
    mnist: 4.0
